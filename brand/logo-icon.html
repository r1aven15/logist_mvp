<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:1024px;height:1024px;overflow:hidden;background:#0B1020}
  .logo{position:relative;width:1024px;height:1024px;background:
    radial-gradient(circle at 22% 18%, rgba(124,60,255,.38), transparent 38%),
    radial-gradient(circle at 82% 78%, rgba(32,217,255,.24), transparent 42%),
    linear-gradient(145deg,#0B1020 0%,#141A2F 55%,#0B1020 100%);
    display:flex;align-items:center;justify-content:center;}
  .grid{position:absolute;inset:0;opacity:.12;
    background-image:radial-gradient(circle, #fff 1px, transparent 1.5px);
    background-size:64px 64px;}
  svg{width:760px;height:760px;position:relative;z-index:2;filter:drop-shadow(0 30px 60px rgba(0,0,0,.35))}
</style>
</head>
<body>
<div class="logo">
  <div class="grid"></div>
  <svg viewBox="0 0 760 760" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8B5CFF"/>
        <stop offset=".55" stop-color="#5B7CFF"/>
        <stop offset="1" stop-color="#22D9FF"/>
      </linearGradient>
      <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#C4B5FF" stop-opacity=".95"/>
        <stop offset=".55" stop-color="#6E8CFF" stop-opacity=".65"/>
        <stop offset="1" stop-color="#22D9FF" stop-opacity=".25"/>
      </linearGradient>
    </defs>
    <path d="M 174 470 A 206 206 0 1 1 586 470" stroke="url(#ring)" stroke-width="34" stroke-linecap="round" opacity=".8"/>
    <circle cx="586" cy="470" r="17" fill="#22D9FF"/>
    <rect x="252" y="474" width="84" height="148" rx="42" fill="url(#g)" opacity=".92"/>
    <rect x="378" y="390" width="84" height="232" rx="42" fill="url(#g)"/>
    <rect x="504" y="286" width="84" height="336" rx="42" fill="url(#g)"/>
    <path d="M 236 634 C 338 596 420 516 520 414" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity=".9"/>
    <path d="M 520 414 L 456 430 M 520 414 L 504 478" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 222 670 H 620" stroke="#FFFFFF" stroke-width="6" opacity=".22" stroke-linecap="round"/>
  </svg>
</div>
</body>
</html>
