name: GLONASS sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "sync or probe"
        required: false
        default: "sync"

concurrency:
  group: glonass-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "firebase-admin>=6.5.0,<7"
      - name: Sync GLONASS to Firestore
        env:
          GLONASS_LOGIN: ${{ secrets.GLONASS_LOGIN }}
          GLONASS_PASSWORD: ${{ secrets.GLONASS_PASSWORD }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          GLONASS_VEHICLE_IDS: "505725,542782,550744,577075,621945,655079"
          GLONASS_FUEL_TANKS: "505725:70"
          GLONASS_TIMEZONE: "7"
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "probe" ]; then
            python3 sync_glonass.py --probe
          else
            python3 sync_glonass.py
          fi
      - name: Healthchecks ping
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS --max-time 10 "$HEALTHCHECK_URL" >/dev/null
          fi
